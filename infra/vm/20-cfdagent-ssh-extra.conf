# Template: scripts/vm-host-setup.sh replaces __ADMIN_USER__ (option --user) and installs this file as
# /etc/ssh/sshd_config.d/20-cfdagent-ssh-extra.conf, after `sshd -t` accepts the whole configuration.
# 20- sorts after 10-cfdagent-hardening.conf (key only, no root) from cloud-init; the first value read
# wins, and the two files set different keywords.
# Three failed attempts per connection (fail2ban still bans after 5 failures in 10 minutes).
MaxAuthTries 3
# Only the VM administrator may log in over SSH.
AllowUsers __ADMIN_USER__
