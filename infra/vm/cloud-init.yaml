#cloud-config
# Template: infra/modules/vm.bicep substitutes the __PLACEHOLDERS__ before the VM is created.
package_update: true
package_upgrade: false
packages:
  - docker.io
  - curl
  - python3
  - fail2ban

write_files:
  # SSH is open to the Internet (owner decision 2026-10-29): keys only, no root, fail2ban below.
  # 10- sorts before the cloud image's 50-cloud-init.conf, and sshd uses the first value it reads.
  - path: /etc/ssh/sshd_config.d/10-cfdagent-hardening.conf
    permissions: "0644"
    owner: root:root
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/fail2ban/jail.d/cfdagent-sshd.local
    permissions: "0644"
    owner: root:root
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  # MaxAuthTries 3 and AllowUsers for the administrator; 20- sorts after the hardening file above.
  # The same file is applied to a running VM by scripts/vm-host-setup.sh.
  - path: /etc/ssh/sshd_config.d/20-cfdagent-ssh-extra.conf
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_SSH_EXTRA__
  - path: /usr/local/sbin/cfdagent-iptables
    permissions: "0755"
    owner: root:root
    encoding: b64
    content: __B64_IPTABLES_SCRIPT__
  - path: /etc/systemd/system/cfdagent-iptables.service
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_IPTABLES_SERVICE__
  - path: /usr/local/sbin/cfdagent-idle-shutdown
    permissions: "0755"
    owner: root:root
    encoding: b64
    content: __B64_IDLE_SCRIPT__
  - path: /etc/systemd/system/cfdagent-idle-shutdown.service
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_IDLE_SERVICE__
  - path: /etc/systemd/system/cfdagent-idle-shutdown.timer
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_IDLE_TIMER__
  - path: /etc/systemd/system/cfdagent-daily-shutdown.service
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_DAILY_SERVICE__
  - path: /etc/systemd/system/cfdagent-daily-shutdown.timer
    permissions: "0644"
    owner: root:root
    encoding: b64
    content: __B64_DAILY_TIMER__

runcmd:
  # State and runs directories belong to the administrator (the idle-shutdown script runs as root).
  - [sh, -c, "install -d -o __ADMIN_USER__ -g __ADMIN_USER__ /var/lib/cfdagent /home/__ADMIN_USER__/runs"]
  - [systemctl, enable, --now, docker]
  - [sh, -c, "mkdir -p /run/sshd && sshd -t && (systemctl reload ssh || true)"]
  - [systemctl, enable, --now, fail2ban]
  - [usermod, -aG, docker, "__ADMIN_USER__"]
  - [systemctl, daemon-reload]
  # Block the metadata endpoints for Docker containers (needs docker.service, enabled above).
  - [systemctl, enable, --now, cfdagent-iptables.service]
  - [systemctl, enable, --now, cfdagent-idle-shutdown.timer]
  - [systemctl, enable, --now, cfdagent-daily-shutdown.timer]
  # The pull is best effort: it fails until the image is published and public.
  - [sh, -c, "docker pull __CONTAINER_IMAGE__ || echo 'image pre-pull failed; pull it manually'"]
