id = "pipe-re500"
family = "laminar-pipe-flow"
task_file = "task.md"
citation = "Hagen-Poiseuille solution for fully developed laminar flow in a circular pipe (analytic): u(r) = 2*U_mean*(1 - (r/R)^2), Delta p = 32*mu*L*U_mean/D^2 (textbook result). Entrance length about 0.05*Re*D (Langhaar, H. L. (1942), J. Appl. Mech. 9, A55-A58: 0.0575*Re*D). Reference CSV generated by make_reference.py from the parameters in that script (D = 0.01 m, U_mean = 0.05 m/s, rho = 1000 kg/m^3, mu = 1e-3 Pa s, Re = 500, pressure planes at x = 0.35 m and 0.45 m)."

# The profile is u / U_mean against r / R (axis to wall); dividing the error (in units of U_mean)
# by 2 expresses it as a fraction of the centreline velocity 2*U_mean, as the threshold requires.
# The reference value of the pressure drop is 32*mu*L*U_mean/D^2 with L = 0.1 m; make_reference.py
# checks it against the formula. Physical parameters live in make_reference.py because the
# registry models forbid unknown keys in this file.

[[criteria]]
quantity = "u_profile_fully_developed"
kind = "profile"
metric = "max_abs_error"
threshold = 0.03
reference_file = "reference/u_profile.csv"
normalise_by = 2.0

[[criteria]]
quantity = "pressure_drop_fully_developed"
kind = "scalar"
metric = "rel_error"
threshold = 0.05
reference_value = 1.6
