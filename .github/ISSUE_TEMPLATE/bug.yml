name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include error messages and relevant log excerpts.
    validations:
      required: true
  - type: input
    id: run-id
    attributes:
      label: Run ID
      description: Run ID of the agent run, if the bug appeared during one. Leave empty otherwise.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, task text, and environment (local, container, Azure VM).
    validations:
      required: false
