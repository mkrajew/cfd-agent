version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Blanket ignore (tag AND digest bumps): the OpenFOAM engine version and the exact image
      # digest are both part of experiment reproducibility. The base image changes only by a
      # deliberate decision of the owner, never by an automatic pull request.
      - dependency-name: opencfd/openfoam-default
