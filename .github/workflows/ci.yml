name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel runs on main or on tags: a cancelled run would skip the publish job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commit history
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pre-commit hooks
        # The hooks that otherwise run only on a developer machine (line endings, YAML and TOML
        # syntax, end-of-file). Skipped here: shellcheck, whose hook downloads a binary (the
        # infra-lint job runs the runner's shellcheck on every shell script), and gitleaks, whose
        # hook scans only staged changes (the step below scans the commits of the pull request
        # or push).
        env:
          SKIP: shellcheck,gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for organisation accounts; this is a personal repo.

  infra-lint:
    name: infra-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep
        run: az bicep install
      - name: Bicep build
        # Every Bicep file must compile without errors or warnings (nothing is deployed here).
        run: |
          set -euo pipefail
          for file in infra/main.bicep infra/modules/*.bicep; do
            out="$(az bicep build --file "${file}" --outfile "${RUNNER_TEMP}/$(basename "${file}" .bicep).json" 2>&1)" || { echo "${out}"; exit 1; }
            if grep -qi 'warning' <<<"${out}"; then echo "${out}"; exit 1; fi
          done
      - name: Shellcheck
        run: shellcheck infra/vm/*.sh scripts/*.sh docker/*.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Both targets share one build cache scope: the second build reuses the layers of the first.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: cfdagent:dev
          # Unpublished build: write the image to a tar file that the next jobs load.
          outputs: type=docker,dest=${{ runner.temp }}/cfdagent-test-image.tar
          cache-from: type=gha,scope=cfdagent-image
          cache-to: type=gha,mode=max,scope=cfdagent-image
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: cfdagent:runtime
          outputs: type=docker,dest=${{ runner.temp }}/cfdagent-runtime-image.tar
          cache-from: type=gha,scope=cfdagent-image
          cache-to: type=gha,mode=max,scope=cfdagent-image
      - name: Upload test image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfdagent-image-test
          path: ${{ runner.temp }}/cfdagent-test-image.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Upload runtime image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfdagent-image-runtime
          path: ${{ runner.temp }}/cfdagent-runtime-image.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  integration:
    name: integration
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download test image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cfdagent-image-test
          path: ${{ runner.temp }}
      - name: Load test image
        run: docker load --input "${RUNNER_TEMP}/cfdagent-test-image.tar"
      - name: Integration tests
        # The sandbox profile of the executor containers, so every pull request proves that the
        # toolchain works under it: no network, no capabilities, no privilege gain, read-only root
        # file system with a scratch /tmp, bounded processes and memory. The checkout is mounted
        # read-only: it is owned by the runner user (uid 1001), the container user (uid 1000) only
        # reads it, and tests write to pytest's tmp_path under /tmp, never to /work.
        run: >
          docker run --rm --init
          --network none
          --cap-drop ALL
          --security-opt no-new-privileges
          --read-only
          --tmpfs /tmp
          --pids-limit 512
          --memory 8g
          -v "$PWD:/work:ro" -w /work
          cfdagent:dev pytest -m integration tests/integration -rs

  sandbox:
    name: sandbox
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Download runtime image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cfdagent-image-runtime
          path: ${{ runner.temp }}
      - name: Load runtime image
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/cfdagent-runtime-image.tar"
          # The sandbox tests skip when the image is missing; here a missing image must fail.
          docker image inspect cfdagent:runtime > /dev/null
      - name: Install dependencies
        run: uv sync --locked
      - name: Sandbox tests
        # The executor containers run the shipped image (the runtime target: no pytest, no uv, no
        # compilers); pytest itself runs on the runner host.
        env:
          CFDAGENT_SANDBOX_IMAGE: cfdagent:runtime
          CFDAGENT_RUNTIME_IMAGE: cfdagent:runtime
        run: uv run pytest -m sandbox tests/sandbox -rs

  publish:
    name: publish
    # Only on pushes to main and on version tags, after everything else is green.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, infra-lint, unit, image, integration, sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mkrajew/cfd-agent
    steps:
      - name: Download runtime image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cfdagent-image-runtime
          path: ${{ runner.temp }}
      - name: Load runtime image
        run: docker load --input "${RUNNER_TEMP}/cfdagent-runtime-image.tar"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested runtime image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker tag cfdagent:runtime "${tag}"
            docker push "${tag}"
          done
