name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel runs on main or on tags: a cancelled run would skip the publish job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of a pull request
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans commit history
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for organisation accounts; this is a personal repo.

  infra-lint:
    name: infra-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Bicep build
        # Every Bicep file must compile without errors or warnings (nothing is deployed here).
        run: |
          set -euo pipefail
          for file in infra/main.bicep infra/modules/*.bicep; do
            out="$(az bicep build --file "${file}" --outfile "${RUNNER_TEMP}/$(basename "${file}" .bicep).json" 2>&1)" || { echo "${out}"; exit 1; }
            if grep -qi 'warning' <<<"${out}"; then echo "${out}"; exit 1; fi
          done
      - name: Shellcheck
        run: shellcheck infra/vm/*.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both targets share one build cache scope: the second build reuses the layers of the first.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: cfdagent:dev
          # Unpublished build: write the image to a tar file that the next jobs load.
          outputs: type=docker,dest=${{ runner.temp }}/cfdagent-test-image.tar
          cache-from: type=gha,scope=cfdagent-image
          cache-to: type=gha,mode=max,scope=cfdagent-image
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: cfdagent:runtime
          outputs: type=docker,dest=${{ runner.temp }}/cfdagent-runtime-image.tar
          cache-from: type=gha,scope=cfdagent-image
          cache-to: type=gha,mode=max,scope=cfdagent-image
      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: cfdagent-image-test
          path: ${{ runner.temp }}/cfdagent-test-image.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Upload runtime image
        uses: actions/upload-artifact@v4
        with:
          name: cfdagent-image-runtime
          path: ${{ runner.temp }}/cfdagent-runtime-image.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  integration:
    name: integration
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: cfdagent-image-test
          path: ${{ runner.temp }}
      - name: Load test image
        run: docker load --input "${RUNNER_TEMP}/cfdagent-test-image.tar"
      - name: Integration tests
        # The sandbox profile of the executor containers, so every pull request proves that the
        # toolchain works under it: no network, no capabilities, no privilege gain, read-only root
        # file system with a scratch /tmp, bounded processes and memory. The checkout is mounted
        # read-only: it is owned by the runner user (uid 1001), the container user (uid 1000) only
        # reads it, and tests write to pytest's tmp_path under /tmp, never to /work.
        run: >
          docker run --rm --init
          --network none
          --cap-drop ALL
          --security-opt no-new-privileges
          --read-only
          --tmpfs /tmp
          --pids-limit 512
          --memory 8g
          -v "$PWD:/work:ro" -w /work
          cfdagent:dev pytest -m integration tests/integration

  sandbox:
    name: sandbox
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: cfdagent-image-*
          merge-multiple: true
          path: ${{ runner.temp }}
      - name: Load images
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/cfdagent-test-image.tar"
          docker load --input "${RUNNER_TEMP}/cfdagent-runtime-image.tar"
          # The sandbox tests skip when an image is missing; here a missing image must fail.
          docker image inspect cfdagent:dev cfdagent:runtime > /dev/null
      - name: Install dependencies
        run: uv sync --locked
      - name: Sandbox tests
        # The tests start hardened executor containers with `docker run` from the test image (the
        # executor needs only the runtime parts of it) and inspect the runtime image.
        env:
          CFDAGENT_SANDBOX_IMAGE: cfdagent:dev
          CFDAGENT_RUNTIME_IMAGE: cfdagent:runtime
        run: uv run pytest -m sandbox tests/sandbox -rs

  publish:
    name: publish
    # Only on pushes to main and on version tags, after everything else is green.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, infra-lint, unit, image, integration, sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mkrajew/cfd-agent
    steps:
      - name: Download runtime image
        uses: actions/download-artifact@v4
        with:
          name: cfdagent-image-runtime
          path: ${{ runner.temp }}
      - name: Load runtime image
        run: docker load --input "${RUNNER_TEMP}/cfdagent-runtime-image.tar"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested runtime image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker tag cfdagent:runtime "${tag}"
            docker push "${tag}"
          done
