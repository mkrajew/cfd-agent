[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfd-agent"
version = "0.0.1"
description = "LLM agents that run full CFD simulations (CadQuery, Gmsh, OpenFOAM) from a plain-language task."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2",
    "numpy",
    "typer",
    "openai",
    "httpx2",
    "azure-identity",
    "azure-storage-blob",
]

[project.optional-dependencies]
# Installed in the Docker image; not required on the host.
toolchain = [
    "cadquery",
    "gmsh",
    "pyvista",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/mkrajew/cfd-agent"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfdagent"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# A misspelled or unregistered marker must be an error: a mis-marked test could silently never run.
addopts = "--strict-markers"
# Tests bind-mounted into the Docker image must import /work/src, not the copy installed in the image.
pythonpath = ["src"]
markers = [
    "integration: tests that need external tools (Docker, OpenFOAM, Gmsh) or services",
    "sandbox: tests that start real hardened executor containers (need Docker and the image)",
    "e2e: end-to-end runs of the full pipeline",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff 0.17 also formats Python blocks inside Markdown; keep it Python-only like the pre-commit hooks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
